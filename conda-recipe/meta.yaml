# Local conda recipe.
#
# This builds from the working tree so the package can be built, installed and
# exercised without publishing anything — no PyPI release, no DOI, no channel,
# nobody else involved. That is the whole point of doing it locally first.
#
# The conda-forge submission (Milestone B) is a near-copy of this with the
# source switched from a local path to the published PyPI sdist plus its
# SHA256, and `extra.recipe-maintainers` added.
#
#   conda build conda-recipe
#   conda create -n fixed2tab-local -c local fixed2tab
#
{% set version = "0.1.0.dev0" %}

package:
  name: fixed2tab
  version: {{ version }}

source:
  # Local path for now. Milestone B replaces this with:
  #   url: https://pypi.org/packages/source/f/fixed2tab/fixed2tab-{{ version }}.tar.gz
  #   sha256: <64 hex chars>
  # conda-forge requires a stable tarball; git_url is a last resort there.
  path: ..

build:
  # Pure Python, identical on every platform and every supported interpreter.
  # The four conditions this relies on are checked in CI: an entry point rather
  # than `scripts=`, no pre/post-link scripts, no selectors, and no
  # version-dependent dependencies.
  noarch: python
  # Bump on every local rebuild of unchanged source. conda keys its cache on
  # name-version-build, so rebuilding without a bump reinstalls the previous
  # package silently -- even with --force-reinstall. The conda-forge submission
  # resets this to 0, since there the version always changes.
  number: 1
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - fixed2tab = fixed2tab.cli:main

requirements:
  host:
    - python >=3.10
    - pip
    - hatchling
  run:
    - python >=3.10

test:
  imports:
    - fixed2tab
  commands:
    # A conda test proves the package was built and installed correctly; it is
    # not the place to re-run the project's own suite.
    - fixed2tab --version
    - fixed2tab --help
    - pip check
  requires:
    - pip

about:
  home: https://github.com/dasch-swiss/rdu-fixed2tab
  summary: Convert fixed-width text files to tabular (TSV)
  description: |
    fixed2tab converts fixed-width column text into TSV, detecting the column
    boundaries automatically by locating character positions that are blank in
    every record.

    Legacy scientific codes still emit results as fixed-width columns, which
    delimiter-based tools cannot read: multi-token cells are shattered, and rows
    where a sparse column is blank have every later field shifted left. Neither
    failure raises an error.

    Every run writes the table, a geometry report and every unparsed line, so
    that table rows plus rejected lines always equals input lines.
  license: MIT
  license_file: LICENSE
  doc_url: https://github.com/dasch-swiss/rdu-fixed2tab#readme
  dev_url: https://github.com/dasch-swiss/rdu-fixed2tab

extra:
  recipe-maintainers:
    - gautschr
