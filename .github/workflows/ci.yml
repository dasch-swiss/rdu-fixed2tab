name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: nothing here pushes, comments or publishes.
permissions:
  contents: read

jobs:
  test:
    name: pytest (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the package claims (requires-python and the recipe's
        # python_min); the newest is tested so the claim stays honest at both
        # ends of the supported range.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # The explicit-LF output guarantee can only be observed where the
          # platform newline is CRLF.
          - python-version: "3.13"
            os: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  lint:
    name: ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src/fixed2tab

  package:
    name: build and packaging checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: LICENSE must be in the sdist
        run: tar -tzf dist/*.tar.gz | grep -q 'LICENSE' || { echo "LICENSE missing from sdist"; exit 1; }

      - name: Tag archive contains LICENSE and builds a wheel
        # conda-forge builds from the GitHub tag archive, which is `git archive`
        # of the tag, with `pip install .`. This rebuilds that tree the same way.
        run: |
          mkdir archive
          git archive HEAD | tar -x -C archive
          test -f archive/LICENSE || { echo "LICENSE missing from the tag archive"; exit 1; }
          pip wheel ./archive --no-deps -w archive-dist

      - name: No top-level tests package in the wheels
        # A conda-forge reviewer check: an installed `tests` package would
        # collide with every other project that ships one.
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          wheels = glob.glob("dist/*.whl") + glob.glob("archive-dist/*.whl")
          for wheel in wheels:
              names = zipfile.ZipFile(wheel).namelist()
              bad = [n for n in names if n.split("/")[0] in {"tests", "test", "_tests"}]
              if bad:
                  sys.exit(f"top-level test package in {wheel}: {bad}")
          PY

      - name: Installed console script works
        run: |
          pip install dist/*.whl
          fixed2tab --version
          fixed2tab --help > /dev/null

      - name: Conda recipe matches the package version and Python floor
        # The recipe cannot read these values from the package, so each is
        # written twice. src/fixed2tab/__init__.py and pyproject.toml are the
        # canonical copies; recipe/recipe.yaml `context:` follows them.
        run: |
          python - <<'PY'
          import re, sys

          def find(pattern, path):
              text = open(path, encoding="utf-8").read()
              match = re.search(pattern, text, re.MULTILINE)
              if match is None:
                  sys.exit(f"{path}: no match for {pattern!r}")
              return match[1]

          package = find(r'^__version__ = "([^"]+)"', "src/fixed2tab/__init__.py")
          floor = find(r'^requires-python = ">=([0-9.]+)"', "pyproject.toml")
          conda = find(r'^  version: "([^"]+)"', "recipe/recipe.yaml")
          python_min = find(r'^  python_min: "([^"]+)"', "recipe/recipe.yaml")
          errors = []
          if package != conda:
              errors.append(f"version: src/fixed2tab/__init__.py has {package}, "
                            f"recipe/recipe.yaml context.version has {conda}")
          if floor != python_min:
              errors.append(f"python floor: pyproject.toml requires-python has {floor}, "
                            f"recipe/recipe.yaml context.python_min has {python_min}")
          sys.exit("\n".join(errors) if errors else 0)
          PY

      - name: Package declares no runtime dependencies
        # Load-bearing for `noarch: python` and for a fast conda-forge review.
        run: |
          python - <<'PY'
          import importlib.metadata as md, sys
          deps = md.requires("fixed2tab") or []
          runtime = [d for d in deps if "extra ==" not in d]
          sys.exit(f"unexpected runtime dependencies: {runtime}" if runtime else 0)
          PY

  conda-recipe:
    name: conda recipe builds and its tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          # The action's own default is older than the version the recipe is
          # tested with locally.
          rattler-build-version: v0.76.1
          recipe-path: recipe/recipe.yaml
          build-args: --channel conda-forge
          upload-artifact: false

  test-data-size:
    name: test-data stays small
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No file over 1 MB, total under 100 KB
        # The Galaxy tool repository fails any file larger than 1 MB, and every
        # instance installing the tool downloads the whole of test-data.
        run: |
          if find test-data -type f -size +1M | grep -q .; then
            echo "a test-data file exceeds 1 MB:"; find test-data -type f -size +1M; exit 1
          fi
          total=$(du -sk test-data | cut -f1)
          echo "test-data total: ${total} KB"
          [ "$total" -lt 100 ] || { echo "test-data exceeds 100 KB"; exit 1; }
